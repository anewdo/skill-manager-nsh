[package]
name = "skills-manager-nsh"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["rlib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
hex = "0.4"
nsh-core = "0.4.0"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "system-proxy"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2.5"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
